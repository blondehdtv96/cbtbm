# Nginx Configuration for 500+ Concurrent Users
# Place this in /etc/nginx/nginx.conf

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;
    
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    ##
    # Timeouts
    ##
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    ##
    # File Descriptors
    ##
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    ##
    # MIME Types
    ##
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    ##
    # Logging
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    ##
    # Gzip Compression
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    ##
    # Brotli Compression (if module installed)
    ##
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript 
    #              application/json application/javascript application/xml+rss;
    
    ##
    # Rate Limiting
    ##
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=save:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    ##
    # FastCGI Cache
    ##
    fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=cbt_cache:100m 
                       max_size=1g inactive=60m use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;
    fastcgi_cache_valid 200 60m;
    fastcgi_cache_valid 404 10m;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
    
    ##
    # Upstream PHP-FPM
    ##
    upstream php-fpm {
        server unix:/var/run/php/php8.1-fpm.sock;
        keepalive 32;
    }
    
    ##
    # Virtual Host Configuration
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name cbt.yourschool.com;
        
        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cbt.yourschool.com;
        
        root /var/www/cbt-smk/public;
        index index.php index.html;
        
        ##
        # SSL Configuration
        ##
        ssl_certificate /etc/ssl/certs/cbt.crt;
        ssl_certificate_key /etc/ssl/private/cbt.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        ##
        # Security Headers
        ##
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        
        ##
        # Static Files Caching
        ##
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        ##
        # Deny Access to Hidden Files
        ##
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        ##
        # Rate Limiting for Login
        ##
        location /login {
            limit_req zone=login burst=3 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        ##
        # Rate Limiting for Save Jawaban
        ##
        location ~ ^/exam/[0-9]+/save-jawaban$ {
            limit_req zone=save burst=10 nodelay;
            limit_conn addr 10;
            
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            # Disable cache for this endpoint
            fastcgi_cache_bypass 1;
            fastcgi_no_cache 1;
        }
        
        ##
        # PHP Processing
        ##
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            # FastCGI Cache (skip for authenticated users)
            set $skip_cache 0;
            if ($http_cookie ~* "laravel_session") {
                set $skip_cache 1;
            }
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;
            fastcgi_cache cbt_cache;
            
            # Timeouts
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
        }
        
        ##
        # Laravel Routes
        ##
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        ##
        # Deny Access to Sensitive Files
        ##
        location ~ /\.env {
            deny all;
        }
        
        location ~ /\.git {
            deny all;
        }
    }
}
