# Replace /var/www/cbt-smk with your actual deploy path, and www-data with
# the user your PHP-FPM pool runs as.
[program:cbt-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/cbt-smk/artisan queue:work redis --queue=default,low --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/cbt-smk/storage/logs/queue-worker.log
stopwaitsecs=3600
