; PHP-FPM Configuration for 500+ Concurrent Users
; Place this in /etc/php/8.1/fpm/pool.d/www.conf (adjust PHP version)

[www]

; ============================================
; PROCESS MANAGER
; ============================================
; Use dynamic process manager
pm = dynamic

; Maximum number of child processes
pm.max_children = 150

; Number of child processes created on startup
pm.start_servers = 30

; Minimum number of idle processes
pm.min_spare_servers = 20

; Maximum number of idle processes
pm.max_spare_servers = 50

; Maximum requests per child before respawn
pm.max_requests = 500

; ============================================
; PROCESS CONTROL
; ============================================
; Process idle timeout
pm.process_idle_timeout = 10s

; ============================================
; STATUS PAGE
; ============================================
pm.status_path = /status

; ============================================
; PING PAGE
; ============================================
ping.path = /ping
ping.response = pong

; ============================================
; LOGGING
; ============================================
; Slow request log
slowlog = /var/log/php-fpm/slow.log
request_slowlog_timeout = 5s

; Access log
access.log = /var/log/php-fpm/access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; ============================================
; RESOURCE LIMITS
; ============================================
; Maximum execution time
request_terminate_timeout = 300s

; Memory limit (per process)
php_admin_value[memory_limit] = 512M

; ============================================
; ERROR HANDLING
; ============================================
php_admin_value[error_log] = /var/log/php-fpm/error.log
php_admin_flag[log_errors] = on

; ============================================
; SESSION
; ============================================
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://127.0.0.1:6379?database=2"

; ============================================
; OPCACHE
; ============================================
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.fast_shutdown] = 1
php_admin_value[opcache.enable_cli] = 0
php_admin_value[opcache.validate_timestamps] = 1

; ============================================
; REALPATH CACHE
; ============================================
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600

; ============================================
; FILE UPLOADS
; ============================================
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[max_file_uploads] = 20

; ============================================
; EXECUTION
; ============================================
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[max_input_vars] = 3000

; ============================================
; SECURITY
; ============================================
php_admin_value[expose_php] = Off
php_admin_value[allow_url_fopen] = On
php_admin_value[allow_url_include] = Off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; ============================================
; TIMEZONE
; ============================================
php_admin_value[date.timezone] = Asia/Jakarta
