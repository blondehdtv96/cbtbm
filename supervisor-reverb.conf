# Runs the Laravel Reverb WebSocket server that powers real-time soal
# updates during an ujian. Replace /var/www/cbt-smk with your actual deploy
# path, and www-data with the user your PHP-FPM pool runs as.
#
# Reverb listens on REVERB_SERVER_HOST:REVERB_SERVER_PORT (see .env, default
# 0.0.0.0:8080) and is NOT meant to be exposed directly to the internet —
# put it behind an nginx reverse proxy that terminates TLS and forwards
# wss://your-domain/app/... to http://127.0.0.1:8080/app/..., matching the
# REVERB_HOST/REVERB_PORT/REVERB_SCHEME values clients connect with.
[program:cbt-reverb]
process_name=%(program_name)s
command=php /var/www/cbt-smk/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/cbt-smk/storage/logs/reverb.log
stopwaitsecs=30
